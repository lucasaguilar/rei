<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>REI</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="monitor">
    <div class="top-strip" aria-hidden="true"></div>
    <div class="glass-frame">
      <main id="screen"><div id="terminal"></div><canvas id="crt"></canvas></main>
    </div>
    <footer class="panel" id="panel">
      <div class="brand"><span class="logo" role="img" aria-label="REI"></span><span class="model">local-first agent</span></div>
      <div class="knobs"></div>
      <div class="phosphor-switch" role="group" aria-label="Phosphor"></div>
      <div class="power"><span class="led" id="led"></span><span>POWER</span></div>
    </footer>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>

# Blueprint de despliegue para Render (https://render.com)
#
# Uso: en Render → "New" → "Blueprint" → elegí este repo. Render crea el
# servicio ya configurado (plan, puerto, health check, env vars).
#
# Nota: el Dockerfile ya define REI_WORKSPACE_PATH=/app y ALLOWED_WORKSPACES=/app,
# así que el agente opera sobre el propio repo de REI. No hace falta repetirlo acá.

services:
  - type: web # expone un puerto (el server OpenAI-compatible), no es un worker
    name: rei
    branch: feat/AGENT-WHATSAPP # hasta que se mergee a main
    runtime: docker # usa el Dockerfile de la raíz
    plan: starter # $7/mes, 512MB, no duerme. Cambiar a "free" si querés el plan sin costo (duerme tras ~15 min sin tráfico).
    # /healthz responde 200 SIN autenticación, que es la razón de que exista: el health check de
    # Render no puede mandar el bearer token, y contra /models (que sí lo exige) recibiría un 401
    # y reiniciaría el servicio en loop.
    healthCheckPath: /healthz
    # `envVars`, as a LIST of `- key:`. NOT `env:` — in a Blueprint `env` is the legacy name of
    # `runtime`, so a map of variables under it fails with "cannot unmarshal !!map into
    # file.Runtime". A `sync: false` entry carries no `value`: Render asks for it on creation.
    envVars:
      # Provider en la nube. El .env local usa "lmstudio" (IP de LAN 192.168.x.x)
      # que NO es alcanzable desde Render, por eso se sobreescribe con OpenRouter.
      - key: MODEL_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: qwen/qwen3.6-plus
      # La key es secreta: sync:false la crea vacía para que la setees por la UI
      # de Render (Environment) sin commitearla a git.
      - key: OPENROUTER_API_KEY
        sync: false
      # Laminar (telemetría) apunta a localhost en el .env local; en la nube no
      # existe, así que se deshabilita para no agregar latencia al arranque.
      - key: REI_TELEMETRY_DISABLED
        value: "true"
      # OBLIGATORIO. El Dockerfile abre el server a 0.0.0.0, y con eso server.ts NO ARRANCA sin
      # este token: lo que queda publicado es un agente que escribe archivos y corre comandos, así
      # que la puerta no puede quedar abierta. sync:false lo crea vacío → generá un secreto largo
      # y cargalo en Render → Environment ANTES del primer deploy, o el servicio no levanta.
      # Los clientes lo mandan como `Authorization: Bearer <token>`.
      - key: REI_SERVER_TOKEN
        sync: false
      # Con token, el CORS deja de ser `*`: un `*` permitiría que cualquier página que visites
      # replique un request con credenciales adjuntas. Poné acá el origen de tu frontend
      # (https://tu-app.com) o dejalo vacío si solo lo vas a usar desde un IDE o curl.
      - key: REI_SERVER_ORIGIN
        sync: false
      # ── WhatsApp Cloud API ──────────────────────────────────────────────────
      # Las 5 son secretas/machine-scoped: sync:false las crea vacías para que las setees
      # por la UI de Render (Environment) sin commitearlas a git.
      #
      # WHATSAPP_VERIFY_TOKEN: un string aleatorio que vos inventás (ej: "rei-wa-2026-x7k").
      #   Meta lo compara en el GET handshake.
      # WHATSAPP_APP_SECRET: de Meta → App Settings → Basic → App Secret.
      #   Firma los POST entrantes (HMAC-SHA256).
      # WHATSAPP_ALLOWED_NUMBERS: "*" = atiende a todos (número corporativo público), o una lista
      #   separada por comas (celulares argentinos CON el 9: "5493410000000").
      #   Vacío = NO atiende a nadie: abrirlo al público tiene que ser explícito.
      # WHATSAPP_ACCESS_TOKEN: de Meta → WhatsApp → API Setup → Permanent Token.
      #   Autentica los envíos por la Graph API.
      # WHATSAPP_PHONE_NUMBER_ID: de Meta → WhatsApp → API Setup → Phone Number ID.
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ALLOWED_NUMBERS
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
